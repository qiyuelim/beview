# 复制为 config.toml 并填写（config.toml 已 gitignore）
# Web 服务监听地址：局域网可访问用 0.0.0.0，仅本机用 127.0.0.1
bind_addr = "0.0.0.0:8765"

# PostgreSQL（把 USER / PASSWORD / 主机换成你的实例）
database_url = "postgres://USER:PASSWORD@127.0.0.1:5432/beview"

# 会话有效期（小时），默认 168 = 7 天
# session_ttl_hours = 168

# OTLP 导出端点（可选）；不配则 span 走 stdout
# otlp_endpoint = "http://127.0.0.1:4318/v1/traces"
